      limitations: ["30분 이상 dropout·jitter 미검증", "LiDAR IMU는 navigation input으로 사용하지 않음"]
    attained_evidence_levels: ["implemented", "automated-tested", "stationary-onboard-verified"]
    evidence_refs: ["SENSOR-CONTRACT", "SENSOR-ODOMETRY-PROBE", "AGX-SOFTWARE-STABILITY", "INTEGRATED-PREFLIGHT-RUN"]
