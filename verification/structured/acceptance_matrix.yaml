    current_claim:
      status: "verified"
      highest_evidence_level: "stationary-onboard-verified"
      claim: "Humble, CycloneDDS, domain 0, eno1 조건에서 재부팅 복구와 30초 전체 비동작 preflight 확인"
      limitations: ["최종 장착 전원·네트워크 미확인"]
    attained_evidence_levels: ["implemented", "stationary-onboard-verified"]
    evidence_refs: ["AGX-REBOOT-PERSISTENCE", "AGX-SOFTWARE-STABILITY", "INTEGRATED-PREFLIGHT-RUN"]
    acceptance_checks:
      - check_id: "runtime-wrapper-recovery"
        status: "passed"
        condition: "AGX 재부팅 후 wrapper를 적용한 read-only 실행"
      - check_id: "integrated-project-preflight"
        status: "passed"
        condition: "환경, graph, TF, topic, 안전 gate, 자원과 teardown 46개 check PASS"
