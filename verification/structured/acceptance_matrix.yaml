modules:
  - module_id: "agx_runtime_dds"
    owner: "external_runtime_and_bringup"
    role: "AGX에서 Go2 ROS 2 graph와 프로젝트 overlay를 재현"
    interfaces:
      inputs: ["eno1", "Go2 peer 192.168.123.161"]
      outputs: ["ROS 2 graph", "Go2 read-only topics"]
    current_claim:
      status: "verified"
      highest_evidence_level: "stationary-onboard-verified"
      claim: "Humble, CycloneDDS, domain 0, eno1 조건에서 재부팅 복구와 30분 전체 비동작 runtime 확인"
      limitations: ["최종 장착 전원·네트워크 미확인"]
    attained_evidence_levels: ["implemented", "stationary-onboard-verified"]
    evidence_refs: ["AGX-REBOOT-PERSISTENCE", "AGX-SOFTWARE-STABILITY", "INTEGRATED-PREFLIGHT-RUN", "STATIONARY-SOAK-RUN"]
    acceptance_checks:
      - check_id: "runtime-wrapper-recovery"
        status: "passed"
        condition: "AGX 재부팅 후 wrapper를 적용한 read-only 실행"
      - check_id: "integrated-project-preflight"
        status: "passed"
        condition: "환경, graph, TF, topic, 안전 gate, 자원과 teardown 46개 check PASS"
      - check_id: "final-network-power"
        status: "deferred"
        condition: "AGX 최종 고정과 최종 전원·Ethernet 구성"
    failure_checks: ["wrapper source 누락", "RMW 또는 domain 불일치", "eno1 binding 누락", "Go2 topic 미수신"]
    revalidation_triggers: ["runtime wrapper 변경", "ROS distro 또는 RMW 변경", "network interface 변경", "AGX 재부팅 정책 변경"]

  - module_id: "sensor_ingress"
    owner: "go2_sensor"
    role: "LiDAR와 선택적 상태 입력을 command 없이 수용"
    interfaces:
      inputs: ["/utlidar/cloud", "/utlidar/imu", "/lf/lowstate"]
      outputs: ["LiDAR acceptance summary"]
    current_claim:
      status: "partial"
      highest_evidence_level: "stationary-onboard-verified"
      claim: "LiDAR layout, frame, timestamp와 30분 통합 수신을 실제 AGX에서 확인"
      limitations: ["최종 장착 시야·cable 차폐 미검증", "LiDAR IMU는 navigation input으로 사용하지 않음"]
    attained_evidence_levels: ["implemented", "automated-tested", "stationary-onboard-verified"]
    evidence_refs: ["SENSOR-CONTRACT", "SENSOR-ODOMETRY-PROBE", "AGX-SOFTWARE-STABILITY", "INTEGRATED-PREFLIGHT-RUN", "STATIONARY-SOAK-RUN"]
    acceptance_checks:
      - check_id: "lidar-readonly-contract"
        status: "passed"
        condition: "PointCloud2 type, utlidar_lidar frame, x/y/z field와 timestamp"
      - check_id: "stationary-long-window-input"
        status: "passed"
        condition: "30분 이상 정지 상태 수신률, gap, frame과 timestamp 추세"
      - check_id: "final-mount-occlusion"
        status: "deferred"
        condition: "AGX 고정 후 LiDAR 시야와 케이블 차폐 확인"
    failure_checks: ["topic 없음", "message type 변경", "frame 변경", "timestamp 역행", "필수 point field 누락"]
    revalidation_triggers: ["sensor firmware 변경", "topic 또는 QoS 변경", "TF frame 변경", "AGX 또는 케이블 장착 변경"]

  - module_id: "tf_model"
    owner: "description_and_bringup"
    role: "공식 Go2 모델과 runtime sensor·odometry frame을 단일 owner로 연결"
    interfaces:
      inputs: ["official Go2 URDF", "/tf", "/tf_static"]
      outputs: ["base sensor frames", "odom to base"]
    current_claim:
      status: "partial"
      highest_evidence_level: "stationary-onboard-verified"
      claim: "canonical base, base to utlidar_lidar와 odom to base runtime 연결 확인"
      limitations: ["공식 onboard base_link 동일성으로 승격하지 않음", "추가 장비 extrinsic과 최종 물리 calibration 미확인"]
    attained_evidence_levels: ["implemented", "stationary-onboard-verified"]
    evidence_refs: ["FRAME-CONTRACT", "STATIC-TF-RUN", "ODOMETRY-ADAPTER-RUN", "ODOMETRY-FRAME-DECISION", "INTEGRATED-PREFLIGHT-RUN"]
    acceptance_checks:
      - check_id: "required-runtime-edges"
        status: "passed"
        condition: "base sensor static TF와 odom to base dynamic TF 조회"
      - check_id: "single-owner-runtime-audit"
        status: "warning"
        condition: "현재 확인한 edge owner 유지; 통합 자동 cycle·중복 검사는 없음"
      - check_id: "final-physical-extrinsic"
        status: "deferred"
        condition: "최종 장착 상태에서 센서 위치와 방향 비교"
    failure_checks: ["필수 edge 누락", "child parent 변경", "동일 edge 중복 publisher", "TF cycle", "timestamp 정지"]
    revalidation_triggers: ["URDF 변경", "frame_contract 변경", "sensor 위치 변경", "TF publisher 추가", "odometry owner 변경"]

  - module_id: "odometry_adapter"
    owner: "go2_state_estimation"
    role: "utlidar odometry를 project canonical odom과 base로 수용"
    interfaces:
      inputs: ["/utlidar/robot_odom"]
      outputs: ["/odom", "odom to base"]
    current_claim:
      status: "partial"
      highest_evidence_level: "stationary-onboard-verified"
      claim: "source validation, base_link to base project mapping, 30분 정지 pose와 clean shutdown 확인"
      limitations: ["30분 정지 yaw drift 경고", "실제 거리·yaw 정확도 미검증", "source covariance all-zero 관찰"]
    attained_evidence_levels: ["implemented", "automated-tested", "replay-verified", "stationary-onboard-verified"]
    evidence_refs: ["ODOMETRY-CONTRACT", "ODOMETRY-FRAME-DECISION", "ODOMETRY-ADAPTER-RUN", "STATIONARY-PERCEPTION-RUN", "INTEGRATED-PREFLIGHT-RUN", "STATIONARY-SOAK-RUN"]
    acceptance_checks:
      - check_id: "stationary-adapter-runtime"
        status: "passed"
        condition: "유효 source를 /odom과 odom to base로 전달"
      - check_id: "stationary-drift-window"
        status: "warning"
        condition: "30분 정지 pose와 yaw drift 기록"
      - check_id: "dynamic-distance-yaw"
        status: "deferred"
        condition: "최종 고정 후 실제 직선 거리와 회전각 비교"
    failure_checks: ["source frame 불일치", "timestamp 역행", "non-finite pose 또는 twist", "중복 odom owner", "pose jump"]
    revalidation_triggers: ["source frame 변경", "adapter mapping 변경", "odometry firmware 변경", "TF owner 변경"]

  - module_id: "obstacle_candidate_perception"
    owner: "go2_perception"
    role: "LiDAR cloud를 base frame의 장애물 후보 cloud로 변환"
    interfaces:
      inputs: ["/utlidar/cloud", "base to utlidar_lidar TF"]
      outputs: ["/perception/obstacle_candidates"]
    current_claim:
      status: "partial"
      highest_evidence_level: "stationary-onboard-verified"
      claim: "정지 onboard source·bag replay·30분 soak와 합성 fault에서 base-frame 후보 출력과 invalid suppression을 확인"
      limitations: ["최종 장애물 분류가 아님", "free-space 증명 아님", "동적 장애물 미검증"]
    attained_evidence_levels: ["implemented", "automated-tested", "replay-verified", "stationary-onboard-verified"]
    evidence_refs: ["PERCEPTION-CONTRACT", "STATIONARY-PERCEPTION-RUN", "INTEGRATED-PREFLIGHT-RUN", "STATIONARY-SOAK-RUN", "SOFTWARE-FAULT-RUNTIME"]
    acceptance_checks:
