open_findings:
  - finding_id: "external_dynamic_map_to_odom_continuity"
    status: "resolved_for_exact_canonical_bag_profile_replay_only"
    evidence: "dimos_odom_accumulated_emit3와 candidate-only coarse 0.1745가 canonical 120초 bag에서 map-correction 기준을 반복 통과했다. 7값 sweep은 0.0698~0.2792 rad에서 4 passed·3 failed를 기록했고, lower-band 0~4도 5개 sweep은 모두 passed했다. lower-band에서는 0°가 yaw 최대값, 1°가 translation 최대값을 각각 최소화했지만 두 후보 모두 canonical로 채택하지 않았다. response expansion false/loop closing true는 공통값이며, 이전 TF/10-frame 누적 실패는 적용 전 조건의 역사적 근거로 보존한다."
    next_test: "TF·scan profile 2×2에서 continuity와 map 품질을 분리하고 다른 bag 또는 live Go2·physical mount·sensor/TF fit에서 재검증"
  - finding_id: "sequential_scan_matching_pose_degradation"
    status: "confirmed_for_canonical_replay_causal_input"
    evidence: "use_scan_matching=false 단일 토글에서 short·full corrected pose가 odometric pose와 같아지고 held-out 일관성이 회복됐으며 loop-off만으로는 회복되지 않았다."
    next_test: "최초 잘못된 sequential correction의 scan geometry·matcher response·candidate selection을 추적"
  - finding_id: "occupancy_generation_residual"
    status: "root_cause_classified_no_candidate"
    evidence: "matching-off pose를 고정한 분석에서 unsupported_occupied가 node 30 또는 그 이전부터 지속됐다. multi_segment_occupied는 primary skeleton 4000→4의 수치 gate를 통과했지만 blind visual QA에서 fan/streak와 topology 가독성이 회귀해 visual-approved winner는 null이고 full 실행은 0회다."
    next_test: "후보 전후 cell-state 전이에서 fan/streak 확산 원인을 추적하고 동일 admitted pose·scan과 blind visual gate로 새 정책을 검증"
  - finding_id: "saved_map_localization_accuracy"
    status: "connectivity_verified_accuracy_unverified"
    evidence: "Domain 64 replay와 12-L2 Domain 0 live no-goal run에서 저장 지도, AMCL finite pose, active lifecycle과 단일 map→odom owner를 확인했다. Live run은 초기 finite pose 1개뿐이며 ground truth가 없다."
    next_test: "최종 장착 뒤 실제 기준 위치·방향과 localization pose를 비교"
  - finding_id: "domain_0_live_shadow"
    status: "mapping_localization_and_no_goal_nav2_completed_stationary_onboard_with_accuracy_deferred"
    evidence: "12-L에서 live scan·정지 SLAM·artifact service를, 12-L2에서 같은 저장 지도와 실제 scan·odometry의 AMCL·Nav2 lifecycle·두 costmap·no-goal·no-command·clean teardown을 확인했다. 지도·localization 정확도와 실제 goal은 미확인이다."
    next_test: "최종 장착 뒤 mapping·localization·no-goal observer를 재검증하고 ground truth 및 별도 승인 아래 실제 goal 시험으로 진행"
