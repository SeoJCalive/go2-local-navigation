urdf_model:
  path: "urdf/go2_description.urdf"
  default_mode: "official_full_model"
  optional_mode: "none"
  enable_argument: null
  default_enable_value: null
  publisher: "bringup/go2_static_tf.launch.py"
  root_frame: "base"
  includes:
    - "full_native_body"
    - "rotor_calflower_foot_links"
    - "visual_collision_inertial"
    - "native_imu_radar_front_camera"
  note: "공식 전체 URDF를 canonical source로 사용한다. 추가 장비와 runtime 연결은 실제 값 확인 후 별도 overlay로 정의한다."

body_model:
  source_urdf: "urdf/go2_description.urdf"
  projection: "config/body_model.yaml"
  official_root_frame: "base"
  project_root_frame: "base"
  status: "official_reference_unverified_onboard"
  provenance:
    kind: "official_source_projection"
    official_commit: "daadf41ee9afce8f90fdc09a98506012691fa122"
    third_party_values_imported: false
    projection_scope: "key_joint_origins_limits_only"
  included:
    - "key_joint_origins_axes_limits"
  excluded:
    - "full_urdf_visual_collision_inertial"
    - "rotor_calflower_links"
    - "native_sensor_transforms"
    - "external_lidar"
    - "map"
    - "odom"
    - "base_footprint"
  note: "YAML은 검색용 projection이며 canonical geometry source가 아니다. canonical root는 base이며 dynamic leg joint TF는 이 단계에서 검증하지 않았다."

transforms:
  map_to_odom:
    parent: "map"
    child: "odom"
    owner: "SLAM 또는 위치 추정 구성요소"
    status: "required_later"
  odom_to_base:
    parent: "odom"
    child: "base"
    owner: "go2_state_estimation/odometry_adapter_node"
    topic: "/odom"
    mapping: "project-accepted base_link to base"
    source: "/utlidar/robot_odom"
    runtime_record: "records/experiments/go2_local_navigation_odom_adapter_20260823.yaml"
    status: "verified_onboard_runtime_project_accepted"
  base_to_imu:
    parent: "base"
    child: "imu"
    owner: "robot_state_publisher"
    source: "urdf/go2_description.urdf"
    geometry: "defined_in_canonical_urdf"
    runtime_source: "/lf/lowstate.imu_state"
    note: "공식 fixed edge이며 robot_state_publisher가 소유한다. AGX static TF runtime 발행을 확인했다."
    status: "official_fixed_geometry_robot_state_publisher_runtime_static_tf_verified"
  base_to_radar:
    parent: "base"
    child: "radar"
    owner: "robot_state_publisher"
    source: "urdf/go2_description.urdf"
    geometry: "defined_in_canonical_urdf"
    note: "공식 fixed edge이며 robot_state_publisher가 소유한다. AGX static TF runtime 발행을 확인했다."
    status: "official_fixed_geometry_robot_state_publisher_runtime_static_tf_verified"
  base_to_front_camera:
    parent: "base"
    child: "front_camera"
    owner: "공식 URDF fixed joint / 향후 robot_state_publisher"
    source: "urdf/go2_description.urdf"
    geometry: "defined_in_canonical_urdf"
    status: "official_geometry_runtime_tf_publisher_unverified_current_project_deferred"
  base_to_utlidar_lidar:
    parent: "base"
    child: "utlidar_lidar"
    owner: "tf2_ros/static_transform_publisher via bringup"
    relation_to_official: "project_accepted_direct_mapping_from_official_radar_joint"
    source_geometry: "urdf/go2_description.urdf::base_to_radar"
    note: "사용자가 설치 센서의 물리 정렬을 확인하여 official radar_joint geometry를 direct runtime edge로 수용했다. 이는 독립 온보드 calibration이 아닌 프로젝트 통합 결정이며, AGX static TF runtime edge를 확인했다."
    geometry:
      translation_m: [0.28945, 0.0, -0.046825]
      rotation_rpy_rad: [0.0, 2.8782, 0.0]
      status: "official_geometry_project_accepted_runtime_static_tf_verified"
    instantiated: true
    status: "verified_onboard_static_tf_bringup_project_accepted_geometry"

validation_boundary:
  allowed:
    - "공식 URDF XML 문법과 robot root 확인"
    - "공식 Go2 전체 link·joint tree와 native sensor link 확인"
    - "body_model.yaml projection의 key joint 값이 공식 URDF와 일치하는지 확인"
    - "공식 radar와 runtime utlidar_lidar의 frame_id·TF publisher를 별도 비교"
    - "wrapper와 ros2 --no-daemon을 사용한 직접 discovery 결과를 daemon graph와 구분"
  not_allowed:
    - "측정하지 않은 runtime transform 수치의 기본값 지정"
    - "이 파일만으로 robot_state_publisher 또는 /tf_static 실행"
    - "map->odom 또는 odom->base를 URDF fixed joint로 추가"
    - "물리 장착·주행 상태가 확정됐다고 판정"

safety:
  guessed_zero_extrinsics_allowed: false
  tf_publishers_enabled: true
  physical_execution: "not_run"
