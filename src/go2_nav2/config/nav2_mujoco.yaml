# MuJoCo RL/FIFO simulation의 유일한 Nav2 설정이다.
# bridge e3fe4a7의 검증 후보를 가져왔으며 실물 또는 synthetic fixture 설정이 아니다.
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: false
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    odom_topic: "/odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.20
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    FollowPath:
      # Humble 1.1.20 shim: path/goal heading uses a constant signed velocity.
      # D01 qpos: +/-0.5 commands yield -0.362/+0.374 rad/s, both responsive.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.10
      forward_sampling_distance: 0.30
      rotate_to_heading_angular_vel: 0.5
      rotate_to_goal_heading: true
      # At 10 Hz, allow the full +/-0.5 command even from opposite +/-1 odom.
      # This is command slew, not a change to the policy's physical acceleration.
      max_angular_accel: 20.0
      simulate_ahead_time: 1.0
      min_vel_x: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 1.0
      # XYThetaIterator rejects only when BOTH speeds are below their minima.
      # Positive XY minimum is necessary to exclude weak in-place yaw samples.
      min_speed_xy: 0.05
      max_speed_xy: 0.25
      min_speed_theta: 0.5
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 10
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

bt_navigator:
  ros__parameters:
    use_sim_time: true
    # Humble's implicit 20 ms RPC wait is shorter than a 100 ms control cycle.
    # Allow that cycle plus scheduling margin for action acknowledgement/result.
    default_server_timeout: 500
    global_frame: "map"
    robot_base_frame: "base"
    odom_topic: "/odom"

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_costmap_topic: "global_costmap/costmap_raw"
    local_costmap_topic: "local_costmap/costmap_raw"
    local_frame: "odom"
    robot_base_frame: "base"
    transform_tolerance: 0.1
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: "map"
      robot_base_frame: "base"
      robot_radius: 0.42
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.65
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: "odom"
      robot_base_frame: "base"
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.42
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.65
        cost_scaling_factor: 3.0
