mapping_scan:
  schema_version: 1
  lifecycle_status: "experimental"
  provenance:
    input_kind: "project_validated_mapping_cloud"
    input_contract: "../go2_perception/mapping_cloud_contract.py"
    parameter_status: "engineering_candidate"
    physical_suitability: "unverified"
  input:
    topic: "/go2_mapping/cloud_validated"
    message_type: "sensor_msgs/msg/PointCloud2"
  output:
    topic: "/scan"
    message_type: "sensor_msgs/msg/LaserScan"
    frame_id: "base"
    minimum_rate_hz: 1.0
  projection_profiles:
    default_profile: "raw_single"
    profiles:
      raw_single:
        status: "project_default"
        scope: "onboard_only"
        converter_input_topic: "/go2_mapping/cloud_validated"
  pointcloud_to_laserscan:
    ros__parameters:
      target_frame: "base"
      transform_tolerance: 0.01
      min_height: -0.25
      max_height: 1.0
      angle_min: -3.141592653589793
      angle_max: 3.141592653589793
      angle_increment: 0.008726646259971648
      scan_time: 0.1
      range_min: 0.25
      range_max: 5.0
      use_inf: true
      inf_epsilon: 1.0
      concurrency_level: 1
      use_sim_time: true
